[project]
name = "mc-blos"
version = "0.1.0"
description = "MC-BLOS: Magnetic field analysis for molecular clouds using Faraday rotation"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Mehrnoosh Tahani"},
]
dependencies = [
    "numpy>=1.20",
    "pandas>=1.3",
    "matplotlib>=3.4",
    "astropy>=5.0",
    "scipy>=1.7",
    "scikit-learn>=1.0",
    "adjustText>=0.7",
    "requests>=2.25",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
