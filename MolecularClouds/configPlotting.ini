# ============================================================================
# PLOTTING CONFIGURATION
# ============================================================================
# This file controls ALL visual styling for figures generated by the pipeline.
# Each section corresponds to specific plot types.
#
# QUICK REFERENCE - Common parameters you might want to change:
#   - Marker colors: Use color names ('red', 'blue') or hex codes ('#FF0000')
#   - Marker sizes: Positive numbers (small=10, medium=50, large=200)
#   - Line widths: Positive numbers (thin=0.5, medium=1.5, thick=3.0)
#   - Colormaps: 'BrBG', 'viridis', 'RdYlBu', 'plasma', 'gist_heat', etc.
#   - Font sizes: Title (12-20), labels (10-16), ticks (8-14)
#   - Transparency (alpha): 0.0 (invisible) to 1.0 (opaque)
# ============================================================================

# ----------------------------------------------------------------------------
# GLOBAL MATPLOTLIB SETTINGS
# ----------------------------------------------------------------------------
[Global]
# Font family: serif, sans-serif, monospace
font_family = serif
# Base font size
font_size = 18
# Use LaTeX rendering (True/False)
use_latex = False

# ----------------------------------------------------------------------------
# FIGURE SIZE AND DPI
# ----------------------------------------------------------------------------
[Figure]
# Width and height in inches
width = 7
height = 7
# Resolution in dots per inch (higher = sharper but larger files)
dpi = 300

# ----------------------------------------------------------------------------
# BACKGROUND HEATMAP (extinction/column density data)
# ----------------------------------------------------------------------------
[Heatmap]
# Colormap for the background extinction data
# Options: BrBG (brown-blue-green), RdYlBu, viridis, plasma, inferno, gist_heat, hot, gray
colormap = hot
# Interpolation method: nearest, bilinear, bicubic
interpolation = nearest

# ----------------------------------------------------------------------------
# COORDINATE AXES AND GRID
# ----------------------------------------------------------------------------
[Axes]
# RA axis
ra_label = RA (degree)
ra_label_fontsize = 20
ra_tick_fontsize = 18
ra_num_ticks = 12
ra_minor_frequency = 5
ra_grid_color = white
ra_grid_alpha = 0.5
ra_grid_linestyle = solid

# Dec axis
dec_label = Dec (degree)
dec_label_fontsize = 20
dec_tick_fontsize = 18
dec_num_ticks = 8
dec_grid_color = white
dec_grid_alpha = 0.5
dec_grid_linestyle = solid

# Galactic coordinate overlay
gal_lon_label = Longitude
gal_lat_label = Latitude
gal_label_fontsize = 18
gal_tick_fontsize = 16
gal_tick_color = grey
gal_num_lon_ticks = 12
gal_num_lat_ticks = 8
gal_grid_color = grey
gal_grid_alpha = 0.5
gal_grid_linestyle = dashed

# ----------------------------------------------------------------------------
# COLORBAR
# ----------------------------------------------------------------------------
[Colorbar]
# Visual extinction colorbar
av_label = $A_V$
av_label_fontsize = 18
av_labelpad = 20
av_tick_fontsize = 16
av_tick_width = 1.2
av_tick_length = 5
av_fraction = 0.035
av_pad = 0.12
av_shrink = 1.0

# Hydrogen column density colorbar
h_label = Hydrogen Column Density
h_label_fontsize = 18
h_labelpad = 20
h_tick_fontsize = 16
h_fraction = 0.035
h_pad = 0.12
h_shrink = 0.8

# ----------------------------------------------------------------------------
# RM MAP PLOT (02bRMMapping.py)
# ----------------------------------------------------------------------------
[RMMap]
# Title
title_fontsize = 16
title_pad = 50

# RM point markers
marker_shape = o
marker_edge_width = 0.5
marker_edge_color = black

# Legend styling
legend_alpha = 0.4
legend_facecolor = white
legend_marker_edge_color = black
legend_marker_facecolor_white = white
legend_marker_alpha = 0.7

# Legend size markers (these represent RM magnitudes)
legend_size_10 = 10
legend_size_50 = 50
legend_size_100 = 100
legend_size_200 = 200

# RM color scheme (red for negative, blue for positive)
rm_negative_color = red
rm_positive_color = blue

# ----------------------------------------------------------------------------
# REFERENCE POINT PLOTS (03c, etc.)
# ----------------------------------------------------------------------------
[RefPoints]
# Reference point markers
marker_shape = o
marker_facecolor = green
marker_edge_width = 0.5
marker_edge_color = black
marker_size = 50

# Point labels
label_fontsize = 11
label_color = white
# Whether to automatically adjust text positions to avoid overlap
adjust_text = True

# Title styling
title_fontsize = 16
title_pad = 50

# Contour lines (if used)
contour_color = black
contour_linewidth = 0.5
contour_alpha = 0.25
contour_cmap = Greys

# ----------------------------------------------------------------------------
# BLOS MAP PLOT (04CalculateBLOS.py)
# ----------------------------------------------------------------------------
[BLOSMap]
# BLOS point markers
marker_shape = o
marker_edge_width = 0.5
marker_edge_color = black

# Colormap for BLOS values
# Options: RdBu (red-blue), seismic, coolwarm, bwr, PuOr, PRGn
blos_colormap = RdBu
# Reverse the colormap (swap positive/negative colors)
blos_reverse_cmap = True

# Title
title_fontsize = 16
title_pad = 50

# Legend
legend_fontsize = 15
legend_alpha = 0.4
legend_facecolor = white

# ----------------------------------------------------------------------------
# CLEAN PUBLICATION FIGURES (no titles, no labels)
# ----------------------------------------------------------------------------
[Publication]
# Set these to False to remove titles and ID labels for clean figures
show_title = False
show_labels = False
